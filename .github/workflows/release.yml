name: 自动发布

# 手动触发，或推送 v1.0.2 这样的标签时触发。
on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: 读取版本
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: 检查各端版本是否一致
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          android_version="$(sed -n 's/.*versionName "\(.*\)".*/\1/p' android/app/build.gradle)"
          ios_version="$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' ios/App/App.xcodeproj/project.pbxproj | head -n 1)"
          echo "package.json: ${version}"
          echo "Android: ${android_version}"
          echo "iOS: ${ios_version}"
          if [ "${version}" != "${android_version}" ] || [ "${version}" != "${ios_version}" ]; then
            echo "::error::版本号不一致，请先同步 package.json / android / ios 的版本。"
            exit 1
          fi

      - name: 生成版本信息
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="v${version}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  android:
    name: Android APK
    needs: prepare
    runs-on: ubuntu-latest
    env:
      # Android 构建不需要 Electron 二进制，跳过下载。
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: 安装依赖
        run: npm ci

      - name: 构建网页并同步到 Android
        run: |
          npm run build
          npx cap sync android

      - name: 确保 Android SDK 36 可用
        shell: bash
        run: |
          if [ ! -d "${ANDROID_HOME}/platforms/android-36" ]; then
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: 还原签名密钥
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "${ANDROID_KEYSTORE_BASE64}" ]; then
            echo "::error::缺少仓库密钥 ANDROID_KEYSTORE_BASE64"
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/android-keys"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 -d > "${RUNNER_TEMP}/android-keys/glimmer-release.jks"

      - name: 使用官方 Gradle 源
        shell: bash
        run: |
          sed -i 's#mirrors.cloud.tencent.com/gradle#services.gradle.org/distributions#g' \
            android/gradle/wrapper/gradle-wrapper.properties

      - name: 打包已签名 APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/android-keys/glimmer-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: 校验签名与版本
        shell: bash
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          set -euo pipefail
          apk="android/app/build/outputs/apk/release/app-release.apk"
          out="Glimmer-${VERSION}-android.apk"
          cp "${apk}" "${out}"

          apksigner="$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -n 1)"
          aapt="$(find "${ANDROID_HOME}/build-tools" -name aapt2 -type f | sort -V | tail -n 1)"

          "${apksigner}" verify --verbose --print-certs "${out}"

          expected="c641d83be77d31890a50427647152236c983cb8296d43f2d2bb0a876d8f8d78d"
          actual="$("${apksigner}" verify --print-certs "${out}" \
            | sed -n 's/.*certificate SHA-256 digest: //p' \
            | head -n 1 | tr -d '\r' | tr 'A-F' 'a-f')"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::签名证书不匹配，禁止发布。期望 ${expected}，实际 ${actual}"
            exit 1
          fi

          badging="$("${aapt}" dump badging "${out}")"
          if ! echo "${badging}" | grep -q "versionName='${VERSION}'"; then
            echo "::error::APK 版本号与 ${VERSION} 不一致"
            exit 1
          fi
          echo "${badging}" | grep -E "^package:|^application-label:"

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: Glimmer-*-android.apk
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows 安装包
    needs: prepare
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建网页
        run: npm run build

      - name: 打包 NSIS 安装包
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: release/Glimmer-*-win-x64.exe
          if-no-files-found: error
          retention-days: 7

  macos:
    name: macOS DMG
    needs: prepare
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 构建网页
        run: npm run build

      # 未配置 Apple 开发者证书时生成未签名 DMG，首次打开需右键“打开”。
      - name: 打包 DMG（Intel + Apple 芯片）
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --x64 --arm64 --publish never

      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: release/Glimmer-*-mac-*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: 发布 GitHub Release
    needs: [prepare, android, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: 列出发布文件
        run: ls -lh artifacts

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: 微光 ${{ needs.prepare.outputs.version }}
          files: artifacts/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            微光 ${{ needs.prepare.outputs.version }}

            - **Windows**：`Glimmer-${{ needs.prepare.outputs.version }}-win-x64.exe`，双击安装。
            - **Android**：`Glimmer-${{ needs.prepare.outputs.version }}-android.apk`，已使用同一发布证书签名，可直接覆盖安装旧版本。
            - **macOS**：Apple 芯片选 `arm64`，Intel 芯片选 `x64`；未签名版本首次打开请右键 → 打开，或执行 `xattr -cr "/Applications/微光.app"`。

            数据保存在各设备本地，跨设备迁移请使用应用内的「同频」。
